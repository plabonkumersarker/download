<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Center</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#050a06;overflow-x:hidden;}

        /* ═══════ GATE LAYER ═══════ */
        #_G{
            position:fixed;inset:0;z-index:9999;overflow:hidden;
            background:
                radial-gradient(ellipse 130% 90% at 18% 65%, #0c1f0f 0%, transparent 55%),
                radial-gradient(ellipse  70% 80% at 85% 20%, #07101a 0%, transparent 55%),
                radial-gradient(ellipse  90% 60% at 55% 100%,#080e0b 0%, transparent 60%),
                #040708;
            animation:_gin .6s ease both;
        }
        @keyframes _gin{from{opacity:0;}to{opacity:1;}}

        /* vignette */
        #_G::before{
            content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
            background:radial-gradient(ellipse 85% 85% at 50% 50%,transparent 30%,rgba(0,0,0,.7) 100%);
        }
        /* grid weave */
        #_G::after{
            content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
            background:
                repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(255,255,255,.015) 60px),
                repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(255,255,255,.015) 60px);
        }

        /* mist particles */
        .px{
            position:absolute;border-radius:50%;pointer-events:none;
            animation:_rise linear infinite;z-index:3;
        }
        @keyframes _rise{
            0%  {transform:translateY(106vh) scale(.4);opacity:0;}
            7%  {opacity:1;}
            93% {opacity:.25;}
            100%{transform:translateY(-8vh) scale(1);opacity:0;}
        }

        /* twinkling stars */
        .st{
            position:absolute;border-radius:50%;pointer-events:none;z-index:3;
            background:rgba(255,255,255,.65);
            animation:_twk ease-in-out infinite alternate;
        }
        @keyframes _twk{from{opacity:.08;}to{opacity:.6;}}

        /* center orb */
        #_Go{
            position:absolute;top:50%;left:50%;z-index:3;pointer-events:none;
            width:340px;height:340px;border-radius:50%;
            transform:translate(-50%,-50%);
            background:radial-gradient(ellipse,rgba(30,80,38,.14) 0%,transparent 72%);
            animation:_orb 7s ease-in-out infinite alternate;
        }
        @keyframes _orb{
            from{transform:translate(-50%,-50%) scale(1);  opacity:.6;}
            to  {transform:translate(-50%,-50%) scale(1.8);opacity:1;}
        }

        /* emoji container */
        #_Ge{position:absolute;inset:0;z-index:5;}

        /* ── emoji node: static, bob only ── */
        .em{
            position:absolute;cursor:pointer;user-select:none;
            pointer-events:auto;line-height:1;
            font-size:3.2rem;         /* ~51px — big enough on small phones */
            padding:14px;             /* expands tap target to ~79px */
            border-radius:50%;
            -webkit-tap-highlight-color:transparent;
            transition:filter .18s ease;
        }
        @media(min-width:480px){.em{font-size:3.7rem;padding:14px;}}
        @media(min-width:900px){.em{font-size:4.2rem;padding:16px;}}

        .em:hover{
            filter:drop-shadow(0 0 16px rgba(255,220,80,.85));
        }

        /* entry fade-in (opacity only, to avoid transform conflict with bob) */
        @keyframes _eIn{
            from{opacity:0;}
            to  {opacity:var(--eo,1);}
        }
        /* vertical bob only */
        @keyframes _bob{
            from{transform:translateY(0);}
            to  {transform:translateY(var(--ba,-10px));}
        }

        /* bottom glow rule */
        #_Gr{
            position:absolute;bottom:0;left:0;right:0;height:1.5px;
            background:rgba(255,255,255,.03);z-index:10;
        }

        /* hint label */
        #_Gl{
            position:absolute;bottom:56px;left:0;right:0;
            text-align:center;z-index:10;
            font:400 .55rem/1 'Helvetica Neue',Helvetica,sans-serif;
            letter-spacing:.32em;text-transform:uppercase;
            color:rgba(255,255,255,.08);user-select:none;
            animation:_hlp 6s ease-in-out infinite;
        }
        @keyframes _hlp{0%,100%{opacity:.4;}50%{opacity:1;}}

        /* ── progress dots ── */
        #_Gprog{
            position:absolute;bottom:24px;left:50%;
            transform:translateX(-50%);
            display:flex;gap:14px;z-index:10;align-items:center;
        }
        .pd{
            width:7px;height:7px;border-radius:50%;
            background:rgba(255,255,255,.1);
            border:1px solid rgba(255,255,255,.18);
            transition:all .5s cubic-bezier(.34,1.56,.64,1);
        }
        .pd.on{
            background:rgba(110,245,148,.88);
            border-color:rgba(110,245,148,.95);
            box-shadow:0 0 8px rgba(110,245,148,.65),0 0 18px rgba(110,245,148,.28);
            transform:scale(1.4);
        }

        /* ═══════ FAKE SUCCESS PANEL ═══════ */
        #_Gf{
            position:fixed;inset:0;z-index:10001;
            display:none;flex-direction:column;
            align-items:center;justify-content:center;
            background:rgba(2,4,7,.97);
            backdrop-filter:blur(30px) saturate(.35);
        }
        #_Gf.on{display:flex;animation:_fon .5s ease;}
        @keyframes _fon{from{opacity:0;}to{opacity:1;}}

        .fr{
            position:absolute;border-radius:50%;pointer-events:none;
            border:1px solid rgba(110,240,145,.1);
            top:50%;left:50%;
            animation:_fring 2.8s ease-out infinite;
        }
        @keyframes _fring{
            0%  {transform:translate(-50%,-50%) scale(.35);opacity:.65;}
            100%{transform:translate(-50%,-50%) scale(4.2); opacity:0;}
        }

        .fc{position:relative;z-index:1;text-align:center;padding:3.5rem 5rem;}
        .fi{
            font-size:4rem;display:block;margin-bottom:1.6rem;
            animation:_fibounce .7s cubic-bezier(.34,1.56,.64,1) .15s both;
        }
        @keyframes _fibounce{
            from{transform:scale(0) rotate(-25deg);opacity:0;}
            to  {transform:scale(1) rotate(0);      opacity:1;}
        }
        .ft{
            font:700 2.9rem/1.1 'Helvetica Neue',Helvetica,sans-serif;
            color:#fff;letter-spacing:-.025em;margin-bottom:.8rem;
        }
        .fs2{
            font:400 .78rem/1 'Helvetica Neue',Helvetica,sans-serif;
            letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.28);
        }

        /* ═══════ PROTECTED PAGE ═══════ */
        #_P{
            min-height:100vh;display:flex;flex-direction:column;
            align-items:center;padding:2rem;
            background:#0a0a0a;color:#e0e0e0;line-height:1.6;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
            opacity:0;pointer-events:none;
            transition:opacity 1.05s ease .1s;
        }
        #_P.vis{opacity:1;pointer-events:auto;}

        .container{width:100%;max-width:800px;}
        h1{
            font-size:2.5rem;margin-bottom:.5rem;text-align:center;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
        }
        .subtitle{text-align:center;color:#888;margin-bottom:3rem;}
        .file-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:1.5rem;
        }
        .file-card{
            background:#1a1a1a;border:1px solid #333;border-radius:12px;
            padding:1.5rem;transition:all .3s ease;
            position:relative;overflow:hidden;
        }
        .file-card:hover{
            transform:translateY(-5px);
            box-shadow:0 10px 30px rgba(102,126,234,.2);
            border-color:#667eea;
        }
        .file-icon{
            width:60px;height:60px;margin-bottom:1rem;
            display:flex;align-items:center;justify-content:center;
            font-size:2rem;border-radius:10px;
        }
        .pdf-icon{background:rgba(255,87,87,.1);color:#ff5757;}
        .img-icon{background:rgba(69,183,209,.1);color:#45b7d1;}
        .file-title{font-size:1.1rem;font-weight:500;margin-bottom:.5rem;color:#f0f0f0;}
        .file-name{font-size:.85rem;color:#666;margin-bottom:1.5rem;font-family:monospace;}
        .download-btn{
            width:100%;padding:.75rem;border:none;border-radius:8px;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            color:#fff;font-size:1rem;font-weight:500;cursor:pointer;
            transition:transform .2s ease;
        }
        .download-btn:hover {transform:scale(1.02);}
        .download-btn:active{transform:scale(.98);}
        .no-files{text-align:center;color:#555;padding:3rem;}
    </style>
</head>
<body>

<!-- ═══════════ GATE LAYER ═══════════ -->
<div id="_G">
    <div id="_Go"></div>
    <div id="_Ge"></div>
    <div id="_Gr"></div>
    <div id="_Gl">Loading experience&hellip;</div>

    <!-- 4 progress dots -->
    <div id="_Gprog">
        <div class="pd"></div>
        <div class="pd"></div>
        <div class="pd"></div>
        <div class="pd"></div>
    </div>

    <!-- Fake success panel -->
    <div id="_Gf">
        <div class="fr" style="width:320px;height:320px;animation-delay:0s"></div>
        <div class="fr" style="width:320px;height:320px;animation-delay:1s"></div>
        <div class="fr" style="width:320px;height:320px;animation-delay:2s"></div>
        <div class="fc">
            <span class="fi">✨</span>
            <div class="ft">Congratulations!</div>
            <div class="fs2">Verification complete&hellip;</div>
        </div>
    </div>
</div>

<!-- ═══════════ PROTECTED CONTENT ═══════════ -->
<div id="_P">
    <div class="container">
        <h1>📁 Download Center</h1>
        <p class="subtitle">Your files, ready when you are</p>
        <div id="fileGrid" class="file-grid"></div>
        <div style="text-align:center;margin-top:160px;">
            <a href="https://plabonkumersarker.github.io/download.tool/" target="_blank"
               style="color:#8a8a8a;text-decoration:none;margin-right:14px;">1.Create_Code</a>
            <a href="https://github.com/plabonkumersarker/download/edit/gh-pages/index.html" target="_blank"
               style="color:#9a9a9a;text-decoration:none;margin-right:14px;">2.Submit_Code</a>
            <a href="https://github.com/plabonkumersarker/download/upload/gh-pages" target="_blank"
               style="color:#9a9a9a;text-decoration:none;">3.Upload_Files</a>
        </div>
    </div>
</div>

<script>
/* ─────────────────────────────────────────
   SECTION A · gate engine
   ───────────────────────────────────────── */
(function(){

    /* authorized codepoints: 🌳 🌲 🌴 */
    var _k = new Set([0x1F333, 0x1F332, 0x1F334]);
    var _m = function(e){
        var a = Array.from(e).map(function(c){ return c.codePointAt(0); });
        return _k.has(a[0]);
    };

    var _x   = false;   /* breach flag */
    var _z   = false;   /* closed flag */
    var _tc  = 0;       /* correct-tap counter */
    var _tReq = 4;      /* taps required */

    /* wrong emoji pool */
    var wrongPool = [
        '🦋','🐦','🦜','🦅','🐝','🦊','🦌','🐸',
        '🦆','🦉','🦢','🦩','🦚','🌸','🌺','🌻',
        '🌹','🍀','🍁','🌿','🌾','🌱','⭐','💫',
        '☁️','🌊','🔮','🌙','✨','🦝','🐺','🐞'
    ];

    /* 7 correct emojis embedded (need only 4 clicks to unlock) */
    var correctOnes = [
        '\uD83C\uDF33','\uD83C\uDF32','\uD83C\uDF34',
        '\uD83C\uDF33','\uD83C\uDF32','\uD83C\uDF34',
        '\uD83C\uDF33'
    ];

    /*
     * 20 fixed grid positions [left%, top%]
     * 4 columns × 5 rows — spaced so 3–4rem emojis never overlap
     * Columns at ~2, 27, 52, 77% → 25% gap ≈ 94px on 375px screen
     * Rows at ~9, 27, 46, 65, 82% → 18-19% gap ≈ 120px on 667px screen
     */
    var POSITIONS = [
        [2, 9], [27, 7], [52, 8], [77, 6],
        [4,27], [29,28], [54,26], [78,27],
        [2,46], [27,47], [52,45], [77,46],
        [4,65], [29,66], [54,63], [78,64],
        [9,82], [34,83], [59,81], [77,82]
    ];

    /* shuffle emoji assignment (positions stay in order, emojis randomised) */
    var wrongShuffled = wrongPool.slice().sort(function(){ return Math.random() - .5; });
    var emojis = correctOnes.concat(wrongShuffled.slice(0, POSITIONS.length - correctOnes.length));
    emojis.sort(function(){ return Math.random() - .5; });

    var gEl  = document.getElementById('_G');
    var gEm  = document.getElementById('_Ge');
    var gFk  = document.getElementById('_Gf');
    var pEl  = document.getElementById('_P');
    var dots = document.querySelectorAll('.pd');

    /* ── ambient mist particles ── */
    for(var i = 0; i < 32; i++){
        var p  = document.createElement('div');
        p.className = 'px';
        var sz = .8 + Math.random() * 3.2;
        var rv = 70  + Math.floor(Math.random() * 55);
        var gv = 140 + Math.floor(Math.random() * 85);
        var bv = 75  + Math.floor(Math.random() * 55);
        p.style.cssText =
            'width:'  + sz + 'px;' +
            'height:' + sz + 'px;' +
            'left:'   + (Math.random() * 100) + '%;' +
            'background:rgba(' + rv + ',' + gv + ',' + bv + ',0.2);' +
            'animation-duration:' + (9 + Math.random() * 17) + 's;' +
            'animation-delay:'    + (-Math.random() * 15)    + 's;';
        gEl.appendChild(p);
    }

    /* ── twinkling stars ── */
    for(var s = 0; s < 22; s++){
        var st  = document.createElement('div');
        st.className = 'st';
        var ssz = .8 + Math.random() * 1.6;
        st.style.cssText =
            'width:'  + ssz + 'px;' +
            'height:' + ssz + 'px;' +
            'left:'   + (Math.random() * 100) + '%;' +
            'top:'    + (Math.random() * 100) + '%;' +
            'animation-duration:' + (1.2 + Math.random() * 3.2) + 's;' +
            'animation-delay:'    + (-Math.random() * 3)        + 's;';
        gEl.appendChild(st);
    }

    /* ── place static emojis ── */
    for(var j = 0; j < POSITIONS.length; j++){
        (function(pos, em, idx){
            var el  = document.createElement('div');
            el.className = 'em';
            el.textContent = em;

            /* individualise the bob */
            var bobAmp = 5  + Math.random() * 14;          /* 5–19 px */
            var bobDur = (2.5 + Math.random() * 3).toFixed(1);  /* 2.5–5.5 s */
            var bobDel = (-(Math.random() * 5)).toFixed(2); /* phase offset */
            var eo     = (0.52 + Math.random() * .48).toFixed(2);

            /* tiny random jitter on position so grid looks organic */
            var lp = (pos[0] + Math.random() * 2 - 1).toFixed(1);
            var tp = (pos[1] + Math.random() * 2 - 1).toFixed(1);

            el.style.cssText =
                'left:' + lp + '%;' +
                'top:'  + tp + '%;' +
                '--ba:-' + Math.round(bobAmp) + 'px;' +
                '--eo:' + eo + ';' +
                /* staggered entry, then continuous bob */
                'animation:' +
                    '_eIn .55s ease ' + (idx * 60) + 'ms both,' +
                    '_bob ' + bobDur + 's ' + bobDel + 's ease-in-out infinite alternate;';

            gEm.appendChild(el);

            /* ── click / touch handler ── */
            function _tap(ev){
                ev.stopPropagation();
                if(_z) return;

                el.removeEventListener('click',     _tap);
                el.removeEventListener('touchstart', _tap);
                el.style.pointerEvents = 'none';

                var isRight  = _m(em);
                var glowRGB  = isRight ? '110,245,148' : '255,88,88';

                /* freeze bob, start burst */
                el.style.animation = 'none';

                var bt0  = null;
                var bDur = 420;
                function bust(ts){
                    if(!bt0) bt0 = ts;
                    var pr = Math.min((ts - bt0) / bDur, 1);
                    var sc, op;
                    if(pr < .28){
                        sc = 1 + (pr / .28) * .75;
                        op = 1;
                    } else {
                        var q = (pr - .28) / .72;
                        sc   = 1.75 - q * 1.7;
                        op   = 1 - q;
                    }
                    el.style.transform = 'scale(' + sc + ')';
                    el.style.opacity   = op;
                    el.style.filter    = 'drop-shadow(0 0 ' + Math.round(34*(1-pr)) + 'px rgba(' + glowRGB + ',' + (1-pr).toFixed(2) + '))';
                    if(pr < 1) requestAnimationFrame(bust);
                    else       el.remove();
                }
                requestAnimationFrame(bust);

                if(!isRight){
                    /* wrong tap → breach → decoy + redirect */
                    if(!_z){ _x = true; _z = true; _end(); }
                } else {
                    /* correct tap */
                    _tc++;
                    if(_tc <= 4 && dots[_tc - 1]) dots[_tc - 1].classList.add('on');
                    if(_tc >= _tReq && !_z){ _z = true; _end(); }
                }
            }

            el.addEventListener('click',     _tap);
            el.addEventListener('touchstart', _tap, { passive: true });

        })(POSITIONS[j], emojis[j], j);
    }

    /* ── resolution ── */
    function _end(){
        if(!_x && _tc >= _tReq){
            /* authorised — silently reveal page */
            setTimeout(function(){
                gEl.style.transition    = 'opacity 1.2s ease';
                gEl.style.opacity       = '0';
                gEl.style.pointerEvents = 'none';
                pEl.classList.add('vis');
                setTimeout(function(){ gEl.remove(); }, 1350);
            }, 180);
        } else {
            /* unauthorised — fake success → Google */
            gFk.classList.add('on');
            setTimeout(function(){
                window.location.replace('https://www.google.com');
            }, 2600);
        }
    }

})();

/* ─────────────────────────────────────────
   SECTION B · page logic (original)
   ───────────────────────────────────────── */
const files = [
    {filename:"1.pdf",  title:"Admit Card (OC - 23)",  type:"pdf"},
    {filename:"2.pdf",  title:"Admit Card (OG - 23)",  type:"pdf"},
    {filename:"3.pdf",  title:"Admit Card (SO - 23)",  type:"pdf"},
    {filename:"4.pdf",  title:"ATN (SO - 23)",          type:"pdf"},
    {filename:"5.pdf",  title:"ATN (OC - 23)",          type:"pdf"},
    {filename:"6.pdf",  title:"ATN (OG - 23)",          type:"pdf"},
    {filename:"7.pdf",  title:"Admit Card (SO-24)",     type:"pdf"},
    {filename:"8.pdf",  title:"Application Copy(BEZA)", type:"pdf"},
    {filename:"9.pdf",  title:"ATN (SO-24)",             type:"pdf"},
    {filename:"10.pdf", title:"ATN (OG-24)",             type:"pdf"},
    {filename:"11.pdf", title:"ATN (OC-24)",             type:"pdf"},
    {filename:"12.pdf", title:"Admit Card (OG - 24)",   type:"pdf"},
    {filename:"13.pdf", title:"ATN (BB - AD)",           type:"pdf"},
    {
  "filename": "14.pdf",
  "title": "Admit Card (OC - 24)",
  "type": "pdf"
},
    {
  "filename": "15.pdf",
  "title": "ATN (SO-26)",
  "type": "pdf"
},
{
  "filename": "16.pdf",
  "title": "ATN (OG-26)",
  "type": "pdf"
},
{
  "filename": "17.pdf",
  "title": "ATN (OC-26)",
  "type": "pdf"
},
{
  "filename": "18.pdf",
  "title": "Admit Card(BB-AD)",
  "type": "pdf"
}
];

function getFileIcon(t){ return t === 'pdf' ? '📄' : t === 'image' ? '🖼️' : '📁'; }

function createFileCard(f){
    const c  = document.createElement('div');
    c.className = 'file-card';
    const ic = f.type === 'pdf' ? 'pdf-icon' : 'img-icon';
    c.innerHTML =
        '<div class="file-icon ' + ic + '">' + getFileIcon(f.type) + '</div>' +
        '<div class="file-title">' + f.title    + '</div>' +
        '<div class="file-name">'  + f.filename + '</div>' +
        '<button class="download-btn" onclick="downloadFile(\'' + f.filename + '\')">Download</button>';
    return c;
}

function downloadFile(fn){
    const l = document.createElement('a');
    l.href = fn; l.download = fn; l.style.display = 'none';
    document.body.appendChild(l); l.click(); document.body.removeChild(l);
}

(function(){
    const g = document.getElementById('fileGrid');
    if(!files.length){
        g.innerHTML = '<div class="no-files">No files available for download.</div>';
        return;
    }
    files.forEach(f => g.appendChild(createFileCard(f)));
})();
</script>
</body>
</html>
